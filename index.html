<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniMEN — Access Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #12141c;
            color: #e2e8f0;
            font-family: 'Courier New', Courier, monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-card {
            background-color: #1e293b;
            border: 2px solid #334155;
            border-radius: 6px;
            width: 100%;
            max-width: 400px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .login-header {
            background: linear-gradient(90deg, #ef4444, #991b1b);
            color: #ffffff;
            font-weight: bold;
            text-align: center;
            font-size: 1.4rem;
            letter-spacing: 2px;
            padding: 15px;
            border-bottom: 2px solid #dc2626;
        }
        .login-body {
            padding: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            color: #94a3b8;
            font-size: 0.85rem;
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .form-input {
            width: 100%;
            background-color: #0f172a;
            border: 2px solid #334155;
            color: #f8fafc;
            padding: 10px 12px;
            font-family: inherit;
            font-size: 1rem;
            border-radius: 4px;
            outline: none;
        }
        .form-input:focus {
            border-color: #ef4444;
        }
        .action-btn {
            width: 100%;
            background: linear-gradient(90deg, #ef4444, #991b1b);
            color: white;
            border: 2px solid #dc2626;
            padding: 12px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }
        .action-btn:hover {
            background: #dc2626;
        }
        .toggle-link {
            color: #94a3b8;
            font-size: 0.85rem;
            text-align: center;
            cursor: pointer;
            display: block;
            text-decoration: underline;
        }
        .toggle-link:hover {
            color: #ef4444;
        }
        .alert-msg {
            font-size: 0.85rem;
            text-align: center;
            margin-top: 15px;
            display: none;
            font-weight: bold;
            padding: 8px;
            border-radius: 4px;
        }
        .error {
            color: #ef4444;
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
        }
        .success {
            color: #22c55e;
            background-color: rgba(34, 197, 94, 0.1);
            border: 1px solid #22c55e;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div id="portal-title" class="login-header">MiniMEN LOGIN</div>
        
        <div class="login-body">
            <div id="alert" class="alert-msg"></div>

            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="login-user">Commander Handle</label>
                    <input type="text" id="login-user" class="form-input" required autocomplete="off" placeholder="Enter name...">
                </div>
                <div class="form-group">
                    <label for="login-pass">Security Crypt</label>
                    <input type="password" id="login-pass" class="form-input" required placeholder="••••••••">
                </div>
                <button type="submit" class="action-btn">Initialize Connection</button>
                <div class="toggle-link" onclick="toggleView(true)">Need an account? Open Registration</div>
            </form>

            <form id="register-form" class="hidden" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="reg-user">New Commander Handle</label>
                    <input type="text" id="reg-user" class="form-input" required autocomplete="off" placeholder="Create name...">
                </div>
                <div class="form-group">
                    <label for="reg-pass">Create Security Crypt</label>
                    <input type="password" id="reg-pass" class="form-input" required placeholder="••••••••">
                </div>
                <button type="submit" class="action-btn">Register Commander</button>
                <div class="toggle-link" onclick="toggleView(false)">Return to Login Portal</div>
            </form>
        </div>
    </div>

    <script>
        const alertBox = document.getElementById('alert');
        const portalTitle = document.getElementById('portal-title');
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');

        // Swap back and forth between Login and Register views
        function toggleView(showRegister) {
            alertBox.style.display = 'none';
            if (showRegister) {
                portalTitle.innerText = "MiniMEN REGISTRATION";
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
            } else {
                portalTitle.innerText = "MiniMEN LOGIN";
                registerForm.classList.add('hidden');
                loginForm.classList.remove('hidden');
            }
        }

        // Processing Registration
        function handleRegister(event) {
            event.preventDefault();
            const username = document.getElementById('reg-user').value.trim();
            const password = document.getElementById('reg-pass').value;

            if (!username || !password) return;

            // Check if user account index array already exists
            let players = JSON.parse(localStorage.getItem('minimen_players')) || {};

            if (players[username.toLowerCase()]) {
                showAlert("HANDLE ALREADY CLAIMED IN SECTOR", "error");
                return;
            }

            // Create record data block and register to browser database
            players[username.toLowerCase()] = {
                name: username,
                password: password
            };
            localStorage.setItem('minimen_players', JSON.stringify(players));

            showAlert("REGISTRATION COMPLETE! YOU CAN NOW LOG IN.", "success");
            document.getElementById('register-form').reset();
            setTimeout(() => toggleView(false), 1500);
        }

        // Processing Login Verification
        function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('login-user').value.trim().toLowerCase();
            const password = document.getElementById('login-pass').value;

            // Fetch stored user data array
            let players = JSON.parse(localStorage.getItem('minimen_players')) || {};
            let account = players[username];

            if (account && account.password === password) {
                alertBox.style.display = 'none';
                
                // Track current session username so profile dashboard knows who loaded the view
                localStorage.setItem('minimen_session', account.name);
                
                window.location.href = 'your-stuff.html';
            } else {
                showAlert("INVALID COMMANDER CREDENTIALS", "error");
            }
        }

        function showAlert(text, type) {
            alertBox.innerText = text;
            alertBox.className = `alert-msg ${type}`;
            alertBox.style.display = 'block';
        }
    </script>
</body>
</html>
