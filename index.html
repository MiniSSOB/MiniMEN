<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniMEN — Access Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #12141c;
            color: #e2e8f0;
            font-family: 'Courier New', Courier, monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-card {
            background-color: #1e293b;
            border: 2px solid #334155;
            border-radius: 6px;
            width: 100%;
            max-width: 400px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .login-header {
            background: linear-gradient(90deg, #ef4444, #991b1b); /* Dark Cyber Red Theme */
            color: #ffffff;
            font-weight: bold;
            text-align: center;
            font-size: 1.4rem;
            letter-spacing: 2px;
            padding: 15px;
            border-bottom: 2px solid #dc2626;
        }
        .login-body {
            padding: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            color: #94a3b8;
            font-size: 0.85rem;
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .form-input {
            width: 100%;
            background-color: #0f172a;
            border: 2px solid #334155;
            color: #f8fafc;
            padding: 10px 12px;
            font-family: inherit;
            font-size: 1rem;
            border-radius: 4px;
            outline: none;
        }
        .form-input:focus {
            border-color: #ef4444;
        }
        .login-btn {
            width: 100%;
            background: linear-gradient(90deg, #ef4444, #991b1b);
            color: white;
            border: 2px solid #dc2626;
            padding: 12px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
            letter-spacing: 1px;
        }
        .login-btn:hover {
            background: #dc2626;
        }
        .error-msg {
            color: #ef4444;
            font-size: 0.85rem;
            text-align: center;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">MiniMEN</div>
        <div class="login-body">
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">Commander Handle</label>
                    <input type="text" id="username" class="form-input" required autocomplete="off" placeholder="Enter name...">
                </div>
                <div class="form-group">
                    <label for="password">Security Crypt</label>
                    <input type="password" id="password" class="form-input" required placeholder="••••••••">
                </div>
                <button type="submit" class="login-btn">Initialize Connection</button>
                <div id="error" class="error-msg">INVALID CREDENTIALS</div>
            </form>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');

            // Absolute hardcoded check for God / God
            if (user === 'God' && pass === 'God') {
                errorDiv.style.display = 'none';
                window.location.href = 'your-stuff.html'; // Routes directly to the main stats page
            } else {
                errorDiv.style.display = 'block';
            }
        }
    </script>
</body>
</html>
