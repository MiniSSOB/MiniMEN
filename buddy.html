<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniMEN - Buddy List</title>
    <style>
        /* Base Game Styling */
        body { 
            background-color: #000; 
            color: #ddd; 
            font-family: 'Courier New', Courier, monospace; 
            display: flex; 
            margin: 0; 
            min-height: 100vh;
        }

        /* Navigation Sidebar */
        #sidebar { 
            width: 220px; 
            background-color: #0a0a0a; 
            padding: 20px 0; 
            border-right: 2px solid #333;
            flex-shrink: 0;
        }
        #sidebar h2 { text-align: center; color: #fff; margin-bottom: 20px; }
        #sidebar a { 
            display: block; 
            color: #85c1e9; 
            text-decoration: none; 
            padding: 10px 20px; 
            border-bottom: 1px solid #222;
            font-weight: bold;
        }
        #sidebar a:hover, #sidebar a.active { 
            background-color: #222; 
            color: #fff; 
            border-left: 4px solid #85c1e9;
        }

        /* Main Content */
        #main-content { 
            flex-grow: 1; 
            padding: 30px; 
            background-color: #111;
        }
        h1 { color: #fff; border-bottom: 1px solid #333; padding-bottom: 10px; margin-top: 0; }

        /* Grid Layout */
        .buddy-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .buddy-panel {
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 15px;
            min-height: 200px;
        }
        .buddy-panel h3 {
            color: #85c1e9;
            margin-top: 0;
            border-bottom: 1px dashed #333;
            padding-bottom: 10px;
            text-align: center;
        }
        .buddy-list {
            list-style: none;
            padding: 0;
            margin: 0;
            text-align: center;
            color: #888;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>MiniMEN</h2>
        <a href="index.html">Command Center</a>
        <a href="battlefield.html">Battlefield</a>
        <a href="armory.html">Armory</a>
        <a href="conquest.html">Conquest</a>
        <a href="training.html">Training</a>
        <a href="upgrades.html">Upgrades</a>
        <a href="intelligence.html">Intelligence</a>
        <a href="alliances.html">Alliances</a>
        <a href="trade.html">Trade</a>
        <a href="safe.html">Safe</a>
        <a href="attack-log.html">Attack Log</a>
        <a href="rewards.html">Rewards</a>
        <a href="statistics.html">Statistics</a>
        <a href="donate.html">Donate</a>
        <a href="buddy-list.html" class="active">Buddy List</a>
        <a href="logout.html">Log Out</a>
    </div>

    <div id="main-content">
        <h1>Buddy List</h1>

        <div class="buddy-grid">
            <div class="buddy-panel">
                <h3>Friend</h3>
                <ul class="buddy-list"><li>No Buddies</li></ul>
            </div>
            <div class="buddy-panel">
                <h3>Enemy</h3>
                <ul class="buddy-list"><li>No Buddies</li></ul>
            </div>
            <div class="buddy-panel">
                <h3>Ignored</h3>
                <ul class="buddy-list"><li>No Buddies</li></ul>
            </div>
            <div class="buddy-panel">
                <h3>Rogue</h3>
                <ul class="buddy-list"><li>No Buddies</li></ul>
            </div>
        </div>
    </div>

</body>
</html>
