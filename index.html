<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE BOX</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="box-container">
  <h1 class="main-title">THE BOX</h1>

  <!-- LOGIN FORM -->
  <div id="loginView">
    <input type="text" id="loginName" placeholder="USERNAME">
    <input type="password" id="loginPw" placeholder="PASSWORD">
    <button id="loginSubmit">LOGIN</button>
    <p class="switch-link" id="gotoRegister">NO ACCOUNT? REGISTER</p>
    <p id="loginError" class="error"></p>
  </div>

  <!-- REGISTER FORM -->
  <div id="registerView" style="display:none">
    <input type="text" id="regName" placeholder="USERNAME">
    <input type="password" id="regPw" placeholder="PASSWORD">
    <button id="regSubmit">REGISTER</button>
    <p class="switch-link" id="gotoLogin">BACK TO LOGIN</p>
    <p id="regError" class="error"></p>
  </div>

  <!-- GAME VIEW -->
  <div id="gameView" style="display:none">
    <div class="cash">💰 <span id="cashAmount">0</span></div>
    <div class="timer">⏱️ NEXT CLICK: <span id="timerDisplay">00:00</span></div>
    <div class="box-button" id="clickBox">
      <span class="big-box">■</span>
      <span>THE BOX</span>
    </div>
    <div id="message">CLICK THE BOX</div>
    <button id="logoutGame">LOGOUT</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
