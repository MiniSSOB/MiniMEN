<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MiniBOSS</title>
<style>
:root{--bg:#0c0e14;--l:#2d3550;--t:#cdd5e8;--d:#7f89a3;--g:#e8b82a;--r:#d9534f;--c:#4ab3a3}
*{box-sizing:border-box}
html,body{overflow-x:hidden;margin:0;background:var(--bg);color:var(--t);font:11px/1.3 Verdana,Tahoma,Arial,sans-serif}
body{max-width:640px;margin:0 auto;padding:0 4px 80px}
#top{position:sticky;top:0;z-index:5;background:linear-gradient(#232b44,#12151f);border:1px solid var(--l);border-top:0;padding:4px 6px 3px}
#gold{display:flex;justify-content:space-between;align-items:baseline;font:bold 18px Verdana,sans-serif;color:var(--g)}
#inc{font-size:10px;color:var(--c);margin-bottom:1px}
#gold small{font-size:11px;color:var(--c)}
#hud{display:flex;flex-wrap:wrap;gap:1px 9px;color:var(--d);font-size:10px}
#xpb{position:relative;height:11px;background:#080a10;border:1px solid var(--l);margin-top:3px}
#xpb i{display:block;height:100%;background:linear-gradient(#3cc4ae,#1f7f6f);width:0}
#xpb>span{position:absolute;left:0;right:0;top:0;text-align:center;font-size:9px;line-height:11px;color:#fff}
#app{display:flex;gap:4px;margin-top:4px;align-items:flex-start}
nav{display:flex;flex-direction:column;gap:2px;width:54px;flex:none;position:sticky;top:var(--th,70px)}
nav button{background:linear-gradient(#34406a,#161b2b 60%);color:#b9c6ea;border:1px solid #3d4870;border-bottom-color:#0a0d16;padding:6px 1px;text-shadow:0 1px 0 #000;font:bold 10px Verdana,sans-serif;cursor:pointer}
nav button.on{background:linear-gradient(#f2c846,#b98a10);color:#1a1300;border-color:#f2c846}
#view{flex:1;min-width:0}
h2{display:flex;justify-content:space-between;align-items:center;margin:0;padding:4px 6px;text-shadow:0 1px 0 #000;border-top-color:#47527a!important;font:bold 11px Verdana,sans-serif;color:var(--g);background:linear-gradient(#2c3552,#171c2d);border:1px solid var(--l)}
h2 span{color:var(--d);font-weight:normal;font-size:10px}
h2 .rfc{display:flex;flex-direction:column;align-items:center;line-height:1.15;color:var(--c,#f5cf55);font:bold 14px Verdana,sans-serif}
h2 .rfc small{font:10px Verdana,sans-serif;color:var(--d);min-height:11px}
.card{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:4px 8px;min-height:38px;border:1px solid var(--l);border-top:0;background:#121623}
.card>span:first-child{min-width:0}
.card>span:first-child b{display:block;font-size:12px}
.card>span:first-child small{display:block;margin:1px 0 0}
.card .act{padding:6px 8px;font-size:11px;min-width:46px}
h2{margin-top:6px}
.card:nth-child(even){background:#181d2c}
.card small{color:var(--d);font-size:10px}
.card>span:last-child{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.tl{display:flex;flex-direction:column;height:calc(100dvh - var(--th,100px) - 128px);min-height:640px;border:1px solid var(--l);border-top:0}
.tl .hd{flex:none;display:flex;justify-content:space-between;padding:3px 6px;background:#0c0f18;color:var(--d);font-size:10px}
.tl .tr{flex:1;min-height:34px;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:2px 6px;background:#121623;border-top:1px solid var(--l)}
.tl .tr:nth-child(odd){background:#181d2c}
.tr .info{flex:1;min-width:0}
.tr .l1{display:flex;justify-content:space-between;gap:6px;font-size:12px}
.tr .l1 b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .cs{color:var(--g);font-weight:bold;white-space:nowrap}
.tr .l2{font-size:10px;margin-top:1px;white-space:nowrap}
.tr small{color:var(--d);margin-left:4px}
.tr .bt{display:flex;gap:8px;flex:none}
.tr .act{padding:8px 6px;font-size:11px;min-width:64px}
.tr .act small{color:inherit;opacity:.85;margin-left:3px;font-weight:normal;font-size:9px}
button{font:inherit;cursor:pointer}
.act{color:#fff;background:linear-gradient(#5b82bd,#2b4875);border:1px solid #7d9fd6;border-bottom-color:#15264a;padding:1px 6px;font:bold 10px Verdana,sans-serif;text-shadow:0 1px 0 #000;white-space:nowrap}
.act.red{background:linear-gradient(#d86a66,#8f2622);border-color:#e88e8a;border-bottom-color:#4a0f0d}
.act.teal{background:linear-gradient(#4fc4ae,#1f7a69);border-color:#7fe0cc;border-bottom-color:#0d3d34}
.act.gold{background:linear-gradient(#f5cf55,#b78a0e);color:#1a1300;border-color:#f5cf55;text-shadow:none}
.act:active{filter:brightness(.8)}.act:disabled{opacity:.35;cursor:default}
.big{display:block;width:100%;padding:16px 6px;margin:4px 0 2px;font:bold 15px Verdana,sans-serif;color:#1a1300;background:linear-gradient(#f5cf55,#b78a0e);border:1px solid #f5cf55;border-bottom-color:#6b4f05}
.big:active:not(:disabled){filter:brightness(.85)}.big:disabled{background:#232a3d;color:var(--d);border-color:var(--l)}
#bt{text-align:center;font:bold 14px Verdana,sans-serif;color:var(--c);margin:2px 0}
.c2,.tag{color:var(--g);font-weight:bold}.tag{color:var(--r)}.e,.win{color:#5fd49a}.h,.lose{color:#ff7a75}
footer{position:fixed;left:0;right:0;bottom:0;z-index:9;background:#0a0d16;border-top:2px solid #3a4568;padding:4px 8px calc(4px + env(safe-area-inset-bottom));font-size:11px;line-height:1.35;color:var(--d);height:60px;overflow:hidden}
footer div:first-child{color:var(--t)}
#tree{position:relative;overflow:auto;height:62vh;min-height:380px;border:1px solid var(--l);background:radial-gradient(circle at 50% 0,#1b2a4a,#0b0f1c);-webkit-overflow-scrolling:touch}
#tree .cv{position:relative;margin:0 auto}#tree svg{position:absolute;left:0;top:0}
.sx{font-weight:bold;color:#5fd0ff}
input{width:100%;background:#080a10;color:var(--t);border:1px solid var(--l);padding:6px;font:12px Verdana,sans-serif}
.scr{max-height:58vh;overflow-y:auto;border:1px solid var(--l);-webkit-overflow-scrolling:touch}
h2 .act{padding:7px 16px;font-size:12px}
.tlab{position:absolute;left:4px;font:bold 10px Verdana;color:#8fa0c8}
.tl.ai{min-height:0;height:calc(100dvh - var(--th,100px) - 124px)}
.tl.ai .tr{min-height:24px;padding:1px 6px;gap:4px}
.tl.ai .tr .info{flex:1}.tl.ai .l1 b{font-size:12px}
.tl.ai .cash{flex:1;text-align:center;color:var(--g);font:bold 15px Verdana;white-space:nowrap}
.tl.ai .mid{flex:none;text-align:right;font-size:10px;line-height:1.15;min-width:52px}
.tl.ai .tr .act{padding:4px 8px;min-width:58px;font-size:11px}
.nd{position:absolute;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;border:3px solid #555;background:#1d2236;font-size:26px;line-height:48px;text-align:center;padding:0;color:#fff;cursor:pointer;filter:grayscale(1) brightness(.55)}
.nd i{position:absolute;right:-6px;bottom:-6px;min-width:22px;height:20px;line-height:18px;border-radius:10px;background:#000;border:2px solid #777;font:bold 11px Verdana;font-style:normal}
.nd.blk{filter:none!important;background:#000;border-color:#1a1d28;color:#2a2f3f;box-shadow:none;font-size:22px}.nd.blk i{display:none}
.nd.op{filter:none;border-color:#9bd}.nd.on{filter:none;border-color:#f2c230;box-shadow:0 0 10px #f2c230}.nd.max{border-color:#3d6;box-shadow:0 0 10px #3d6}
.nd.ok{border-color:#fff;box-shadow:0 0 12px #6cf}.nd.sel{outline:3px solid #fff;outline-offset:3px}
#tinfo{padding:8px;border:1px solid var(--l);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:8px}

.qb{display:flex;align-items:center;gap:3px;padding:4px 6px;border:1px solid var(--l);border-top:0;background:#121623}
.qb b{color:var(--d);font-size:10px;margin-right:2px}.qb .act{flex:1;padding:7px 0;min-width:0;font-size:11px}
.lk{border-left:3px solid var(--rc)}.lk>span:first-child b,.lk .rl{color:var(--rc)}.rl{font-style:normal;font-weight:bold;margin-right:4px}
.r0{--rc:#aab3c9}.r1{--rc:#5fd49a}.r2{--rc:#5fb0ff}.r3{--rc:#c06bff}.r4{--rc:#ffb52e;box-shadow:inset 0 0 14px rgba(255,181,46,.2)}
.card.gone{opacity:.35}
body{background:#080a10 repeating-linear-gradient(45deg,rgba(255,255,255,.018) 0 2px,transparent 2px 4px)}
#top{border-bottom:2px solid #8a6a12;box-shadow:0 2px 6px #000}
h2{background:linear-gradient(#3a4670,#1a2036 55%,#121626);border-bottom:1px solid #000;box-shadow:inset 0 1px 0 #5a6aa0;letter-spacing:.4px;text-transform:uppercase;font-size:10.5px}
h2 span,h2 b{text-transform:none}
.card{background:linear-gradient(#161b2c,#10141f);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.card:nth-child(even){background:linear-gradient(#1b2134,#141829)}
.act{border-radius:2px;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 1px 2px #000}
nav button{border-radius:2px;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 1px 2px #000}

.card>span:last-child{flex-wrap:nowrap;flex:none}.card>span:first-child{flex:1}
.card .act.teal{min-width:78px}.card .act:not(.teal){min-width:56px}
.fm{display:flex;gap:3px;align-items:flex-start}.fl{width:43%;flex:none}.fr{flex:1;min-width:0}
.fb{border:1px solid var(--l);background:#121623;padding:4px}.fb small{display:block;color:var(--d);font-size:9px;margin-bottom:2px}
.fb textarea{width:100%;height:64px;background:#080a10;color:var(--t);border:1px solid var(--l);font:11px Verdana,sans-serif;padding:3px;resize:none}
.fa{text-align:right;margin-top:3px}.fa .act{padding:6px 14px}
.fh{padding:4px 6px;margin-top:3px;font:bold 10px Verdana;color:var(--g);background:linear-gradient(#3a4670,#1a2036 55%,#121626);border:1px solid var(--l);box-shadow:inset 0 1px 0 #5a6aa0;cursor:pointer;word-break:break-word}
.fr .fh{margin-top:0;cursor:default}
.fs{max-height:60vh;border-top:0}
.ft{display:flex;justify-content:space-between;gap:4px;padding:5px;border-top:1px solid var(--l);font-size:10px;background:#121623;cursor:pointer;word-break:break-word}
.ft b{color:var(--d);flex:none}.ft.on{background:#2a3558;color:#fff}
.fp{padding:4px 6px;border-top:1px solid var(--l);background:#121623;font-size:10px}.fp b{color:var(--g)}.fp small{color:var(--d);font-size:9px}
.fx{white-space:pre-wrap;word-break:break-word;margin-top:2px}
</style>
</head>

const buyBtns=(a,i,base,r,L,cap)=>{const q=Math.min(S.qty,cap-L),c=bc(base,r,L,q),m=bmax(base,r,L,S.cash,cap);
  return L>=cap?btn(a,i+':1','Max','',true):btn(a,i+':'+S.qty,`x${fq(q)} $${fmtG(c)}`,'teal',c>S.cash)+btn(a,i+':max',`Max${m?' '+fq(m):''}`,'',m<1)};
function rows(ids){
  return `<div class="tl"><div class="hd"><span>Player / cash / ATK DEF SPY SEN</span><span>Recon &middot; Rob (left today)</span></div>`+
  ids.map(id=>{const p=P(id),c=cur(p),sn=S.seen[id],live=rate(2)>=2*c.e;
    const cash=live?'$'+fmtG(cashOf(p)):sn?'~$'+fmt(sn.c):'???';
    const st=sn?`<span class="${rate(0)>sn.d?'e':'h'}">${fmt(sn.a)}/${fmt(sn.d)}/${fmt(sn.s)}/${fmt(sn.e)}</span><small>${ago(sn.t)}</small>`:'<span class="dim">?/?/?/?</span>';
    const rl=left(S.rcn,id),al=left(S.ac,id);
    return `<div class="tr"><div class="info"><div class="l1"><b>${p.n}</b><span class="cs">${cash}</span></div><div class="l2">${st}</div></div><div class="bt">${btn('recon',id,`Recon<small>${rl}</small>`,'teal',rl<1)}${btn('rob',id,`Rob<small>${al}</small>`,'red',S.at<1||al<1||(sn&&rate(0)<=sn.d))}</div></div>`}).join('')+`</div>`}
const V={
  lucky:()=>{lkChk();const L=S.lk;return `<h2>Lucky <span>new stock in <b id="lkt"></b></span></h2>`+L.items.map((it,i)=>{const o=lkInfo(it),gone=L.g.includes(i),k=it.t==='buff'?it.b:it.t==='free'?'free':it.t==='shield'?'shield':null,cb=k&&S.bf&&S.bf[k],blk=cb&&cb.t>Date.now()&&cb.m>(it.m||1);return `<div class="card lk r${it.r}${gone?' gone':''}"><span><b>${o[0]}</b><small><i class="rl">${RAR[it.r][0]}</i> ${o[1]}</small></span><span>${gone?'<small>SOLD</small>':btn('lk',L.s+':'+i,'$'+fmtG(it.p),'teal',S.cash<it.p||blk)}</span></div>`}).join('')},
  buy:()=>`<h2>Armory <span>inventory $${fmtG(K.reduce((a,_,k)=>a+wvalue(k),0))}</span></h2>`+qtyBar()+
    K.map((n,k)=>`<h2>${n}s <span>power ${fmt(power(k))} | rating ${fmt(rate(k))}</span></h2>`+WN[k].map(([nm,pw],j)=>{const pr=wprice(k,j),m=fl(S.cash/pr);return card(`${nm} x${fmt(S.inv[k][j])}`,`${pw} power | $${fmtG(pr)}`,btn('buy',`${k}:${j}:${S.qty}`,`x${fq(S.qty)} $${fmtG(pr*S.qty)}`,'teal',pr*S.qty>S.cash)+btn('buy',`${k}:${j}:max`,`Max${m?' '+fmt(m):''}`,'',m<1))}).join('')).join(''),
  targets:()=>`<h2>Battlefield</h2>`+card('No players here yet','Real players will show up here when the server goes live',''),
  ai:()=>`<h2>AI Fights <span class="rfc"><small id="rft"></small>${rfLeft().toLocaleString('en-US')}</span> ${btn('aref',0,'Refresh','teal',rfLeft()<1)}</h2><div class="tl ai"><div class="hd"><span>Name</span><span>Cash</span><span>Attacks ${fl(S.at)}</span></div>`+S.ai.map((t,i)=>{const ok=rate(0)>t.d;
    return `<div class="tr"><div class="info"><div class="l1"><b>${t.big?'&#9733; ':''}${t.n}</b></div></div><div class="cash">$${fmtG(t.c)}</div><div class="mid">ATK ${fmt(rate(0))}<br>DEF <b class="${ok?'e':'h'}">${fmt(t.d)}</b></div><div class="bt">${btn('ai',i,'Attack','red',S.at<1)}</div></div>`}).join('')+`</div>`,
  level(){if(!LAY)layout();const row=(a,b)=>card(a,'',`<b>${b}</b>`),n=TT[tsel],L=tl(tsel),mx=L>=n[4],c=tcost(tsel),op=tOpen(tsel),tot=n[3]*L,
      val=n[2]==='bpay'?fl((1.2**tot-1)*100)+'%':n[3]<1?+(tot*100).toFixed(1)+'%':fl(tot),t=n[6];
    const hid=t>(U_()+1),info=hid?`<div id="tinfo"><span><b>???</b><br><small>Unlock the tier above to reveal</small></span><span><small>Locked</small></span></div>`:`<div id="tinfo"><span><b>${n[0]}</b> ${L}/${n[4]}<br><small>${n[1]}${L?` | now ${val}`:''}${op?'':` | Spend ${GT[t-2]} points in the tiers above first (${above(t)}/${GT[t-2]})`}</small></span><span>${op?(mx?'<small>Maxed</small>':btn('tal',tsel+':1',`+1 (${c} pt${c>1?'s':''})`,'teal',S.pts<c)+btn('tal',tsel+':max','Max','',S.pts<c)):'<small>Locked</small>'}</span></div>`;
    const U=[1,2,3,4,5,6,7].filter(t=>t<2||above(t)>=GT[t-2]).pop(),lab=LAY.lab.map(o=>`<div class="tlab" style="top:${o.y}px">Tier ${o.t}${o.t===U+1?' (locked: spend '+GT[o.t-2]+' points in the tiers above, now '+above(o.t)+')':o.t>U+1?' ???':''}</div>`).join('');
    const nodes=TT.map((t,k)=>{const l=tl(k),o=tOpen(k),m=l>=t[4];return `<button class="nd ${t[6]>U+1?'blk':''} ${m?'max':l?'on':o?'op':''} ${o&&!m&&S.pts>=tcost(k)?'ok':''} ${k===tsel?'sel':''}" style="left:${LAY.pos[k].x}px;top:${LAY.pos[k].y}px" data-a="sel" data-i="${k}">${t[6]>U+1?'?':(IC[t[2]]||'*')}<i>${l}</i></button>`}).join('');
    return `<h2>Talents <span>${S.pts} points (1 per level)</span></h2>${info}<div id="tree"><div class="cv" style="width:${LAY.W}px;height:${LAY.H}px">${lab}${nodes}</div></div><h2>Lifetime</h2>`+
    row('Rank',`Level ${S.lvl} ${rank()}`)+row('Won / lost',`${S.w} / ${S.l}`)+row('Players met / scouted',`${Object.keys(S.met).length} / ${Object.keys(S.seen).length}`)+row('Stolen','$'+fmtG(S.rob))+row('Biggest payout','$'+fmtG(S.best))+
    row('Earned','$'+fmtG(S.earned))+row('Login streak',S.streak+' days')},
  shop(){
    return qtyBar()+`<h2>Rackets <span>$${fmtG(income()*mult())}/hr total</span></h2>`+
    RK.map((r,i)=>card(`${r[0]} Lv${S.R[i]}`,`$${fmtG(r[1]*mult())}/hr base | now $${fmtG(rinc(i)*mult())}/hr`,S.lvl<r[3]?`<small>Needs level ${r[3]}</small>`:buyBtns('rk',i,r[2]*(1-Math.min(.3,T('rcost'))),RG,S.R[i],9999))).join('')},
  bonus:()=>{const p=v=>+(v*100).toFixed(1)+'%',r=(a,b)=>card(a,'',`<b>${b}</b>`),owned=S.R.filter(x=>x>0).length,ms=Math.min(1,.5+T('minsteal')),
      rb=k=>p(Math.min(.9,T(k)+T('aall')));
    return `<h2>Cash</h2>`+r('All cash income',p(mult()-1))+r('Racket income',p(T('rack')+T('div')*owned))+r('Racket income while away',p(T('off')))+r('Racket prices','-'+p(Math.min(.3,T('rcost'))))+r('Racket income now','$'+fmtG(income()*mult())+'/hr')+
    `<h2>Fighting</h2>`+r('Attack rating',fmt(rate(0))+' ('+p(T('stat')+T('asc')+T('atk'))+' bonus)')+r('Defense rating',fmt(rate(1))+' ('+p(T('stat')+T('asc')+T('def'))+' bonus)')+r('Spy rating',fmt(rate(2))+' ('+p(T('stat')+T('asc')+T('spy'))+' bonus)')+r('Sentry rating',fmt(rate(3))+' ('+p(T('stat')+T('asc')+T('sen'))+' bonus)')+
    r('Cash from robbing',p(T('loot')))+r('Extra on tough targets',p(T('bh')))+r('Steal range',p(ms)+' - 100%')+r('Chance to take all cash',p(Math.min(.5,T('luck'))))+r('Chance to steal weapons',p(Math.min(1,T('plunder'))))+r('Free attack chance',p(Math.min(.5,T('free'))))+r('Max attacks',acap())+r('Attack regeneration','+'+p(T('regen')))+r('XP bonus',p(T('xp')))+
    `<h2>Defense and gear</h2>`+r('Cash lost to raiders','-'+p(Math.min(.9,T('raid'))))+r('Weapon prices','-'+p(Math.min(.5,T('scheap'))))+
    `<h2>Bank</h2>`+r('Capacity','$'+fmtG(bankCap()))+r('Robbed cash banked',rb('arob'))+r('Racket income banked',rb('arack'))+
    `<h2>Other</h2>`+r('AI refreshes per day',fmt(rfLimit()))+r('Jackpot target wait','-'+p(Math.min(.5,T('hunt'))))+r('Login bonus',p(T('login')))},
  forum:()=>{const F=S.fm||{t:[]},t=F.t.find(x=>x.id===S.fsel);
    return `<div class="fm"><div class="fl"><div class="fb"><small>${t?'Comment on: '+esc(t.t.slice(0,22)):'Name your new topic'}</small><textarea id="fbox" maxlength="500">${esc(S.fd||'')}</textarea><div class="fa">${btn('fpost',0,'Add!','teal')}</div></div>
    <div class="fh" data-a="fnew" data-i="0">Topics (Add topic)</div><div class="scr fs">${F.t.length?F.t.map(x=>`<div class="ft${x.id===S.fsel?' on':''}" data-a="ftop" data-i="${x.id}"><span>${esc(x.t)}</span><b>${x.p.length}</b></div>`).join(''):'<div class="ft"><span>No topics yet</span></div>'}</div></div>
    <div class="fr">${t?`<div class="fh">${esc(t.t)}</div><div class="fp"><b>${esc(t.by)}</b> <small>started ${ago(t.c)} ago</small></div><div class="scr fs">`+t.p.map(p=>`<div class="fp"><div><b>${esc(p.by)}</b> <small>${ago(p.at)} ago</small></div><div class="fx">${esc(p.m)}</div></div>`).join('')+`</div>`:''}</div></div>`},
  clan:()=>{if(!S.clan)return `<h2>Clan</h2>`+card('You are not in a clan','',btn('clanNew',0,'Create clan','teal'));const c=S.clan;
    return `<h2>[${c.t}] ${c.n} <span>${c.members.length} member${c.members.length>1?'s':''}</span></h2>`+card('Clan net worth','',`<b>$${fmt(worth())}</b>`)+
    `<h2>Members</h2>`+c.members.map(m=>card(m.n,m.role,'')).join('')+
    `<h2>Invites <span>${c.inv.length}</span></h2>`+(c.inv.length?c.inv.map(v=>card(v.n,'waiting for the server','')).join(''):card('No invites sent','',''))+
    card('Clan options','',btn('clanInv',0,'Invite player','teal')+btn('clanDel',0,'Leave','red'))},
  players:()=>{const q=(S.q||'').trim().toLowerCase(),all=[{n:S.name,lv:S.lvl,nw:worth(),a:rate(0),t:S.clan?S.clan.t:''}],res=q?all.filter(p=>p.n.toLowerCase().includes(q)):[];
    return `<h2>Find a player</h2><div class="card"><span style="flex:1"><input id="pq" value="${(S.q||'').replace(/"/g,'')}" placeholder="Player name" maxlength="16"></span><span>${btn('psearch',0,'Search','teal')}</span></div>`+
    (q?(res.length?res.map(p=>card(`${p.t?'['+p.t+'] ':''}${p.n}`,`Level ${p.lv} | Attack ${fmt(p.a)}`,`<b>$${fmt(p.nw)}</b>`)).join(''):card('No players found','','')):'')},
  stats:()=>{const r=(a,b)=>card(a,'',`<b>${b}</b>`),tm=ms=>{const m=fl(ms/6e4);return fl(m/60)+'h '+m%60+'m'},T_=S.tot,E=['rob','rack','oth'].reduce((a,k)=>a+(T_[k]||0),0),
      tp=TT.reduce((a,_,i)=>a+spent(i),0),rr=S.rf&&Date.now()-S.rf.t<864e5?S.rf.t+864e5-Date.now():0;
    return `<h2>Refreshes</h2>`+r('AI refreshes left today',`${fmt(rfLeft())} / ${fmt(rfLimit())}`)+r('Resets in',rr?tm(rr):'starts on your next refresh')+
    `<h2>Lucky</h2>`+r('Items bought',fmt(S.lkn))+r('Spent in Lucky','$'+fmtG(T_.lk||0))+
    `<h2>Fights</h2>`+r('Attacks made',fmt(S.w+S.l))+r('Wins / misses',`${fmt(S.w)} / ${fmt(S.l)}`)+r('Win rate',S.w+S.l?(100*S.w/(S.w+S.l)).toFixed(1)+'%':'-')+r('Recons done',fmt(S.rcc))+r('Biggest hit','$'+fmtG(S.bestHit))+r('Weapons stolen',fmt(S.stolenW))+r('Times raided',fmt(S.rl))+r('Lost to raiders','$'+fmtG(S.rlost))+
    `<h2>Money (all time)</h2>`+r('Total earned','$'+fmtG(E))+r('From robbing','$'+fmtG(T_.rob||0))+r('From rackets','$'+fmtG(T_.rack||0))+r('Other','$'+fmtG(T_.oth||0))+r('Spent on weapons','$'+fmtG(T_.wsp||0))+r('Spent on rackets','$'+fmtG(T_.rsp||0))+
    `<h2>Account</h2>`+r('Net worth','$'+fmtG(worth()))+r('Level',S.lvl)+r('Talent points spent / unspent',`${tp} / ${S.pts}`)+r('Login streak',S.streak+' days')+r('Time played',tm(Date.now()-S.first))},
  ranks:()=>{const me={n:S.name,lv:S.lvl,nw:worth(),a:rate(0)},B=[me].sort((a,b)=>b.nw-a.nw).slice(0,100);
    return `<h2>Leaderboard <span>top 100 by net worth</span> ${btn('name',0,'Rename','teal')}</h2>`+
    B.map((p,i)=>card(`#${i+1} ${p.n}`,`Level ${p.lv} | Attack ${fmt(p.a)}`,`<b>$${fmtG(p.nw)}</b>`)).join('')},
  alog:()=>{const h=n=>new Date(n).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}),tm=e=>`${h(e.t)} (${ago(e.t)} ago)`,t=hb24(),
      A_=S.alog.filter(e=>e.k!=='raid'),B_=S.alog.filter(e=>e.k==='raid');
    return `<h2>Last 24 hours</h2>`+card(`<span class="win">Taken $${fmtG(t.g)}</span>`,`${t.gn} successful hits`,'')+card(`<span class="lose">Lost $${fmtG(t.l)}</span>`,`hit by raiders ${t.ln} times`,'')+
      card(`Net $${fmtG(Math.abs(t.g-t.l))}`,t.g>=t.l?'you are ahead':'you are behind','')+
      `<h2>Your attacks <span>${S.w} wins / ${S.l} misses</span></h2>`+(A_.length?`<div class="scr">`+A_.map(e=>e.k==='hit'?
      card(`<span class="win">${e.n}</span>`,`${tm(e)}<br>stole $${fmtG(e.c)} (${e.p}% of their cash), +${fmt(e.x)} XP${e.w?'<br>weapons: '+e.w:''}`,''):
      card(`<span class="lose">${e.n}</span>`,`${tm(e)}<br>${e.why}, wasted an attack`,'')).join('')+`</div>`:card('No attacks yet','',''))+
      `<h2>Been hit <span>${S.rl} times (-$${fmtG(S.rlost)} total)</span></h2>`+(B_.length?`<div class="scr">`+B_.map(e=>card(`<span class="lose">${S.name}</span>`,`${tm(e)}<br>lost $${fmtG(e.c)} to a raider`,'')).join('')+`</div>`:card('Nobody has hit you yet','',''))},
  bank(){
    return `<h2>Bank <span>holds up to $${fmtG(bankCap())}</span></h2>`+
    card('Pocket $'+fmtG(S.cash),'raiders can take this',btn('dep',1,'Bank all','teal',S.cash<1||S.bank>=bankCap()))+card('Bank $'+fmtG(S.bank),'safe from raiders',btn('wd',1,'Withdraw all','',S.bank<1))+(()=>{const m=Math.max(0,6048e5-(Date.now()-S.bt));return card(S.bank>0?`Releases in ${fl(m/864e5)}d ${fl(m/36e5)%24}h`:'Bank is empty','no deposit or withdrawal','')})()}
};
const TABS={lucky:'Lucky',buy:'Armory',targets:'Targets',ai:'AI Fights',level:'Talents',shop:'Rackets',bank:'Bank',ranks:'Ranks',alog:'Attack Log',stats:'Stats',bonus:'Bonuses',clan:'Clan',players:'Players',forum:'Forum'};
function hud(){
  $('#log').innerHTML=S.log.slice(0,3).join('')||'<div>No activity yet</div>';
  $('#gold').innerHTML=`<span>$${fmtG(S.cash)}</span><small>Bank $${fmtG(S.bank)}</small>`;
  $('#inc').innerHTML=`Income $${fmtG(incPM())}/min ($${fmtG(incPM()*60)}/hr)`;
  $('#xpb i').style.width=Math.min(100,S.xp/need()*100)+'%';$('#xpb span').innerHTML=`Level ${S.lvl}: ${fmt(S.xp)} / ${fmt(need())} XP`;
  $('#hud').innerHTML=(noSave?'<span style="color:#ff7a75">SAVING BLOCKED: progress will be lost when you close this tab</span>':'')+`<span>Lv ${S.lvl}${S.pts?` (${S.pts} talent pts!)`:''}</span><span>Attacks ${fl(S.at)}/${acap()}</span><span>ATK ${fmt(rate(0))}</span><span>DEF ${fmt(rate(1))}</span><span>SPY ${fmt(rate(2))}</span><span>SEN ${fmt(rate(3))}</span>`+bfs()}
function boxTimer(){const rt=$('#rft');if(rt){const r=S.rf,m=r&&Date.now()-r.t<864e5?r.t+864e5-Date.now():0,z=fl(m/1e3);rt.textContent=m?`${fl(z/3600)}:${String(fl(z/60)%60).padStart(2,'0')}:${String(z%60).padStart(2,'0')}`:''}
  const lt=$('#lkt');if(lt){const z=fl(lkLeft()/1e3);lt.textContent=fl(z/60)+':'+String(z%60).padStart(2,'0')}}
function render(){
  $('#nav').innerHTML=Object.entries(TABS).map(([k,v])=>`<button data-t="${k}" class="${k===tab?'on':''}">${v}</button>`).join('');
  const tr=$('#tree');if(tr&&tr.scrollTop!==undefined&&tab==='level')tsc=[tr.scrollLeft,tr.scrollTop,1];
  $('#view').innerHTML=V[tab]();hud();boxTimer();
  if(tab==='level'){const t2=$('#tree');if(t2&&t2.scrollTop!==undefined){t2.scrollLeft=tsc[2]?tsc[0]:Math.max(0,(LAY.W-t2.clientWidth)/2);t2.scrollTop=tsc[1]}}else tsc[2]=0;
  const d=document.documentElement;if(d)d.style.setProperty('--th',($('#top').offsetHeight||70)+'px');
}
document.addEventListener('input',e=>{if(e.target&&e.target.id==='fbox')S.fd=e.target.value});
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-t]');if(t){tab=t.dataset.t;render();return}
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  const a=b.dataset.a,i=['rob','recon','dep','wd','qty','sel','ai'].includes(a)?+b.dataset.i:b.dataset.i;
  A[a](i);tick();save();render();
});
load();
{const away=(Date.now()-S.t)/1000,c0=S.cash;tick();
 if(away>60){const m=fl(away/60);log(`Welcome back! Away ${fl(m/60)}h ${m%60}m: ${S.cash>=c0?'+':'-'}$${fmtG(Math.abs(S.cash-c0))} cash`,'win')}}
save();render();
document.addEventListener('visibilitychange',()=>{tick();if(document.hidden)save();else render()});
window.addEventListener('pagehide',()=>{tick();save()});
setInterval(()=>{tick();if(lkFresh){lkFresh=false;if(tab==='lucky')render()}hud();boxTimer()},1000);
setInterval(save,5000);
</script>
