<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>THE BOX</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="screen">
  <!-- HUGE TITLE AT TOP - ALWAYS VISIBLE -->
  <div class="massive-title">THE BOX</div>

  <!-- LOGIN SCREEN -->
  <div id="loginScreen">
    <div class="form-card">
      <input type="text" id="loginName" placeholder="USERNAME">
      <input type="password" id="loginPass" placeholder="PASSWORD">
      <button id="doLoginBtn">ENTER</button>
      <p class="switch" id="gotoReg">NO ACCOUNT? REGISTER</p>
      <div id="loginMsg" class="error-msg"></div>
    </div>
  </div>

  <!-- REGISTER SCREEN (hidden at start) -->
  <div id="registerScreen" style="display:none">
    <div class="form-card">
      <input type="text" id="regName" placeholder="USERNAME">
      <input type="password" id="regPass" placeholder="PASSWORD">
      <button id="doRegBtn">REGISTER</button>
      <p class="switch" id="gotoLog">BACK TO LOGIN</p>
      <div id="regMsg" class="error-msg"></div>
    </div>
  </div>

  <!-- GAME SCREEN (hidden until logged in) -->
  <div id="gameScreen" style="display:none">
    <div class="stats-row">
      <div class="stat">💰 <span id="cashVal">0</span></div>
      <div class="stat">⏱️ <span id="timerVal">00:00</span></div>
    </div>
    
    <div id="boxBtn" class="big-box-button">
      <div class="box-icon">■</div>
      <div class="box-label">OPEN THE BOX</div>
    </div>
    
    <div id="gameMsg" class="result-area">Click the box</div>
    
    <button id="logoutBtn" class="logout">LEAVE</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
