<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>THE BOX - Kings of Chaos Style</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="game-container" id="appRoot">
  <div class="game-title">THE BOX</div>

  <!-- LOGIN / REGISTER DYNAMIC PANEL -->
  <div id="authContainer"></div>

  <!-- MAIN GAME PANEL (hidden until logged in) -->
  <div id="mainPanel" class="hidden">
    <div class="balance-area">
      <span class="balance-text">💰 CASH STACK</span>
      <span class="balance-amount" id="balanceDisplay">$0</span>
    </div>

    <div class="timer-area">
      <div style="font-size: 14px; margin-bottom: 6px;">⏱️ NEXT BOX CLICK IN</div>
      <div class="timer-digits" id="timerDisplay">00:00</div>
    </div>

    <div class="the-box-button" id="clickBoxBtn">
      <div class="box-text">■ THE BOX ■</div>
      <div style="font-size: 12px; margin-top: 8px;">[ CLICK FOR REWARD ]</div>
    </div>

    <div id="resultMessage" class="result-message">Ready to open the box? 🎲</div>

    <div class="micro-menu">
      <button id="logoutBtn">🚪 LOG OUT</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
