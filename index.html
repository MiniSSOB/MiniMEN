<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>MiniBOSSX — forums soon</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0e16;
      background-image: radial-gradient(circle at 20% 30%, #111827 1px, #05080f 1px);
      background-size: 32px 32px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      font-family: 'Segoe UI', 'Roboto', system-ui, 'Helvetica Neue', sans-serif;
    }

    /* site title outside the frame */
    .site-title {
      text-align: center;
      margin-bottom: 12px;
    }
    .site-title h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: #eaf2ff;
      text-shadow: 0 2px 0 #0a101c;
    }
    .site-title h1 span {
      color: #5d9eff;
    }

    /* main frame */
    .game-shell {
      width: 900px;
      max-width: 100%;
      background: #121724;
      border: 1px solid #2a3a55;
      box-shadow: 8px 8px 0 #050a12;
    }

    .game-shell {
      font-size: 11px;
    }

    .header {
      background: #0c111c;
      padding: 8px 14px;
      border-bottom: 2px solid #3e6a97;
      display: flex;
      justify-content: flex-end;
      align-items: baseline;
      flex-wrap: wrap;
    }

    .badge {
      background: #1a2538;
      font-size: 9px;
      padding: 3px 8px;
      color: #9bb8e2;
      border: 1px solid #2f405e;
      text-transform: uppercase;
    }

    .content {
      padding: 18px 20px;
    }

    .coming h2 {
      font-size: 22px;
      font-weight: 600;
      color: #cddfff;
      border-left: 4px solid #4a7ec7;
      padding-left: 12px;
      margin-bottom: 6px;
    }

    .coming .sub {
      font-size: 10px;
      color: #869dc9;
      margin-left: 16px;
      border-bottom: 1px dotted #2e4264;
      display: inline-block;
      padding-bottom: 2px;
    }

    .info-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 24px 0 20px;
    }

    .tiny-card {
      background: #0e1422;
      border: 1px solid #25334d;
      padding: 8px 12px;
      flex: 1;
      min-width: 130px;
    }

    .tiny-card .label {
      font-size: 8px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #6a89bb;
      margin-bottom: 4px;
    }

    .tiny-card .value {
      font-size: 10.5px;
      font-weight: 500;
      color: #cce2ff;
    }

    .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 22px;
    }

    .tiny-btn {
      background: #192237;
      border: 1px solid #354b72;
      padding: 6px 14px;
      font-size: 10px;
      font-weight: 500;
      color: #d6e6ff;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: default;
      font-family: inherit;
      transition: 0.05s linear;
    }

    .tiny-btn:hover {
      background: #253459;
      border-color: #5c7fb2;
    }

    .footer-note {
      margin-top: 22px;
      padding-top: 12px;
      border-top: 1px solid #1f2c42;
      font-size: 9px;
      text-align: right;
      color: #61759e;
    }

    /* no rounded corners */
    .game-shell,
    .header,
    .tiny-card,
    .tiny-btn {
      border-radius: 0px;
    }

    @media (max-width: 700px) {
      body {
        padding: 0.5rem;
      }
      .content {
        padding: 12px 14px;
      }
      .site-title h1 {
        font-size: 20px;
      }
      .coming h2 {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>

<!-- Site name outside the frame -->
<div class="site-title">
  <h1>MiniBOSS<span>X</span></h1>
</div>

<div class="game-shell">
  <div class="header">
    <div class="badge">// new server</div>
  </div>
  <div class="content">
    <div class="coming">
      <h2>forums coming soon</h2>
      <div class="sub">old tools removed</div>
    </div>

    <div class="info-strip">
      <div class="tiny-card">
        <div class="label">next phase</div>
        <div class="value">forum · shit talking · ranks</div>
      </div>
      <div class="tiny-card">
        <div class="label">backend</div>
        <div class="value">dedicated box</div>
      </div>
      <div class="tiny-card">
        <div class="label">status</div>
        <div class="value">rebuilding · no eta</div>
      </div>
    </div>

    <div class="action-row">
      <span class="tiny-btn">⚔️ forum prep</span>
      <span class="tiny-btn">🖥️ server info</span>
      <span class="tiny-btn">🎮 later</span>
    </div>

    <div class="footer-note">
      domain will point to dedicated server soon
    </div>
  </div>
</div>

</html>
